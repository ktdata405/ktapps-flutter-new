version: 2.1

orbs:
  flutter: circleci/flutter@2.0.4
  android: circleci/android@3.0.0

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.10.1-ndk
    resource_class: large
    environment:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - checkout

      - run:
          name: Install Flutter SDK
          command: |
            git clone https://github.com/flutter/flutter.git -b stable ~/flutter
            echo 'export PATH="$PATH:$HOME/flutter/bin"' >> $BASH_ENV
            source $BASH_ENV
            flutter precache

      - run:
          name: Flutter diagnostics
          command: |
            flutter --version
            flutter doctor -v

      - run:
          name: Install Android NDK
          command: |
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" || true

      - run:
          name: Ensure Gradle wrapper is executable
          command: chmod +x android/gradlew

      - run:
          name: Install dependencies
          command: flutter pub get

      - run:
          name: Run tests
          command: flutter test

      - run:
          name: Build release APK
          command: flutter build apk --release
          no_output_timeout: 20m

      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk

workflows:
  build:
    jobs:
      - build-apk:
          filters:
            branches:
              only:
                - dev-github
                - main

