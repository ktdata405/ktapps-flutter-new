version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.10.1-ndk
    resource_class: large
    steps:
      - checkout

      - run:
          name: Accept Android Licenses & Setup NDK
          command: |
            yes | sdkmanager --licenses || true
            sdkmanager "ndk;27.0.12077973" "cmdline-tools;latest"

      - run:
          name: Install Flutter SDK
          command: |
            git clone --depth 1 https://github.com/flutter/flutter.git -b stable $HOME/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter precache --android
            flutter doctor -v

      - run:
          name: Ensure Gradle wrapper is executable
          command: chmod +x android/gradlew

      - run:
          name: Install Flutter dependencies
          command: flutter pub get

      - run:
          name: Run Flutter tests
          command: flutter test

      - run:
          name: Build release APK
          command: flutter build apk --release --verbose
          no_output_timeout: 25m

      - store_artifacts:
          path: build/app/outputs/flutter-apk/
          destination: apks

workflows:
  build:
    jobs:
      - build-apk:
          filters:
            branches:
              only:
                - dev-github
