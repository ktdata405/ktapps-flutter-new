name: Build Flutter Android APK

on:
  push:
    branches: ["dev-github"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        id: setup_java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Export Java for all steps
        run: |
          echo "JAVA_HOME=${{ steps.setup_java.outputs.path }}" >> "$GITHUB_ENV"
          echo "${{ steps.setup_java.outputs.path }}/bin" >> "$GITHUB_PATH"
          java -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter JDK
        env:
          JAVA_HOME: ${{ steps.setup_java.outputs.path }}
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          flutter config --jdk-dir="$JAVA_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"

      - name: Flutter diagnostics
        run: |
          flutter --version
          flutter doctor -v

      - name: Create local.properties
        run: |
          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_SDK" >> android/local.properties
          cat android/local.properties

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: |
          set -o pipefail
          java -version
          if ! flutter build apk --debug --verbose 2>&1 | tee build-debug.log; then
            echo "::group::First FAILURE block (debug)"
            awk '/FAILURE: Build failed with an exception\./,0' build-debug.log > build-debug-failure.log || true
            if [ -s build-debug-failure.log ]; then
              head -n 200 build-debug-failure.log
            else
              tail -n 200 build-debug.log
            fi
            echo "::endgroup::"
            exit 1
          fi

      - name: Build release APK
        run: |
          set -o pipefail
          java -version
          if ! flutter build apk --release --verbose 2>&1 | tee build-release.log; then
            echo "::group::First FAILURE block (release)"
            awk '/FAILURE: Build failed with an exception\./,0' build-release.log > build-release-failure.log || true
            if [ -s build-release-failure.log ]; then
              head -n 200 build-release-failure.log
            else
              tail -n 200 build-release.log
            fi
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            build-debug.log
            build-debug-failure.log
            build-release.log
            build-release-failure.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
